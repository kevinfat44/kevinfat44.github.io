<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇯🇵 2026 名古屋冬季初訪之旅</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { --primary: #2C3E50; --accent: #E74C3C; --bg-light: #F8F9FA; --card-shadow: 0 10px 30px rgba(0,0,0,0.05); --transition: all 0.3s ease; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-light); color: #333; line-height: 1.7; scroll-behavior: smooth; }
        .hero { position: relative; height: 50vh; display: flex; align-items: center; justify-content: center; color: white; text-align: center; overflow: hidden; }
        .hero-video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; z-index: 1; transform: translate(-50%, -50%); object-fit: cover; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(44,62,80,0.7), rgba(0,0,0,0.5)); z-index: 2; }
        .hero-content { position: relative; z-index: 3; padding: 20px; }
        .hero-content h1 { font-family: 'Noto Serif JP', serif; font-size: 3rem; margin-bottom: 15px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .navbar { position: sticky; top: 0; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.05); padding: 10px 0; overflow-x: auto; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; gap: 8px; padding: 0 20px; }
        .nav-link { color: var(--primary); text-decoration: none; padding: 6px 14px; border-radius: 20px; transition: var(--transition); font-size: 0.9rem; font-weight: 500; white-space: nowrap; }
        .nav-link:hover { background-color: var(--primary); color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .section-title { font-family: 'Noto Serif JP', serif; font-size: 1.8rem; color: var(--primary); margin: 40px 0 20px 0; border-left: 5px solid var(--accent); padding-left: 15px; }
        .day-card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 30px; box-shadow: var(--card-shadow); }
        .day-header { font-size: 1.3rem; color: var(--accent); margin-bottom: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eee; padding-bottom: 10px; }
        .itinerary-table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        .itinerary-table td { padding: 12px 10px; border-bottom: 1px solid #F2F4F4; font-size: 0.95rem; }
        .time-col { width: 110px; font-weight: bold; color: #7F8C8D; }
        .cost-col { width: 110px; color: #27AE60; font-weight: 500; }
        .trans-col { width: 140px; color: #2980B9; font-weight: 500; }
        .hotel-tag { background: #E8F4F8; color: #2980B9; padding: 6px 14px; border-radius: 6px; font-weight: 500; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; }
        .summary-box { background: #FCF3CF; padding: 10px 15px; border-radius: 6px; font-size: 0.88rem; margin-top: 10px; display: inline-block; color: #B7950B; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: var(--card-shadow); transition: var(--transition); display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.08); }
        .card-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        .card-desc { font-size: 0.9rem; color: #666; margin-bottom: 15px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background-color: var(--primary); color: white; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 0.88rem; transition: var(--transition); }
        .btn:hover { background-color: var(--accent); }
        .coupon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .coupon-card { background: #FFF5F5; border: 2px dashed var(--accent); border-radius: 10px; padding: 20px; text-align: center; transition: var(--transition); text-decoration: none; color: inherit; display: block; }
        .coupon-card:hover { transform: scale(1.02); background: #FFEBEB; }
        .coupon-name { font-weight: bold; font-size: 1.1rem; margin-top: 8px; color: var(--primary); }
    </style>
</head>

</html>
